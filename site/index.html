<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minigames">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="shared/pwa.js" data-root="./"></script>
<title>Minigames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="shared/theme.css">
<style>
.games { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.game {
  display: grid; gap: 10px; text-decoration: none; height: 100%;
  transition: transform .12s;
}
.game:hover { transform: translateY(-3px); }
.game:focus-visible { outline-offset: 3px; }
.game h2 { font-size: 2rem; line-height: 1; }
.game p { margin: 0; opacity: .8; }
.game .meta { font-family: var(--mono); font-size: .8rem; opacity: .6; }
.game .go { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); color: var(--accent); font-size: 1.2rem; }
.soon { border: 2px dashed var(--line); border-radius: var(--radius-lg); padding: 20px; color: var(--muted); display: grid; align-content: center; }
@media (prefers-reduced-motion: reduce) { .game { transition: none; } }
header { display: grid; gap: 12px; position: relative; }
/* Settings: gear in the top right corner of the header */
.gear { position: absolute; top: 0; right: 0; width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: 50%; color: var(--muted); transition: color .15s, transform .3s; }
.gear:hover { color: var(--accent); transform: rotate(45deg); }
.gear svg { width: 26px; height: 26px; }
header h1 { padding-right: 52px; }
@media (prefers-reduced-motion: reduce) { .gear { transition: none; } .gear:hover { transform: none; } }
.install { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
</style>
</head>
<body>
<main class="page">
  <header>
    <a class="gear" href="settings/" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
    <h1>Mini<span>games</span></h1>
    <p class="lede">Party games. Pass one device around, or play together on everyone's own phone.</p>
    <div class="install" id="install" hidden>
      <button id="installBtn" class="primary" type="button">Install app</button>
      <span class="hint">Adds Minigames to your home screen. Works offline.</span>
    </div>
    <p class="hint" id="iosHint" hidden>To install on iPhone or iPad: tap Share, then <b>Add to Home Screen</b>.</p>
  </header>
  <ul class="games" id="games">
    <li class="soon">Loading games…</li>
  </ul>
</main>
<script>
// Install prompt (Chrome, Edge, Android). iOS has no prompt, so show a hint instead.
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstall = e;
  document.getElementById("install").hidden = false;
});
document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice.catch(() => {});
  deferredInstall = null;
  document.getElementById("install").hidden = true;
});
window.addEventListener("appinstalled", () => { document.getElementById("install").hidden = true; });
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) document.getElementById("iosHint").hidden = false;

(async () => {
  const ul = document.getElementById("games");
  try {
    const games = await (await fetch("games.json")).json();
    ul.innerHTML = "";
    for (const g of games) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "game face"; a.href = g.url;
      a.innerHTML = `<h2></h2><p></p><span class="meta"></span><span class="go">Play →</span>`;
      a.querySelector("h2").textContent = g.title;
      a.querySelector("p").textContent = g.tagline || "";
      a.querySelector(".meta").textContent = g.players || "";
      li.append(a); ul.append(li);
    }
    const soon = document.createElement("li");
    soon.className = "soon"; soon.textContent = "More games coming.";
    ul.append(soon);
  } catch {
    ul.innerHTML = `<li class="soon">Couldn't load the game list. Try reloading the page.</li>`;
  }
})();
</script>
</body>
</html>
